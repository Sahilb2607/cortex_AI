name: cortex ai deployment

# things in run means command
# and in uses of steps we write the github actions

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =========================
      # GATEWAY SERVICE
      # =========================

      - name: Build Gateway
        run: |
          docker build \
          -f backend/gateway/Dockerfile \
          -t gateway backend

      # Here \ means command is continued on next line

      - name: Tag Gateway
        run: |
          docker tag gateway:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: Push Gateway
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      # =========================
      # AUTH SERVICE
      # =========================

      - name: Build Auth
        run: |
          docker build \
          -f backend/services/auth/Dockerfile \
          -t auth-service backend

      - name: Tag Auth
        run: |
          docker tag auth-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      - name: Push Auth
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      # =========================
      # CHAT SERVICE
      # =========================

      - name: Build Chat
        run: |
          docker build \
          -f backend/services/chat/Dockerfile \
          -t chat-service backend

      - name: Tag Chat
        run: |
          docker tag chat-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: Push Chat
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      # =========================
      # AGENT SERVICE
      # =========================

      - name: Build Agent
        run: |
          docker build \
          -f backend/services/agent/Dockerfile \
          -t agent-service backend

      - name: Tag Agent
        run: |
          docker tag agent-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: Push Agent
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      # =========================
      # BILLING SERVICE
      # =========================

      - name: Build Billing
        run: |
          docker build \
          -f backend/services/billing/Dockerfile \
          -t billing-service backend

      - name: Tag Billing
        run: |
          docker tag billing-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      - name: Push Billing
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      # =========================
      # DEPLOY SERVICES TO ECS
      # =========================

      - name: Deploy Gateway
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.GATEWAY_SERVICE }} \
          --force-new-deployment

      - name: Deploy Auth
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.AUTH_SERVICE }} \
          --force-new-deployment

      - name: Deploy Chat
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.CHAT_SERVICE }} \
          --force-new-deployment

      - name: Deploy Agent
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.AGENT_SERVICE }} \
          --force-new-deployment

      - name: Deploy Billing
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.BILLING_SERVICE }} \
          --force-new-deployment

  # =========================
  # FRONTEND DEPLOYMENT
  # =========================

  deploy-frontend:
    # Frontend deployment starts only after
    # backend deployment is completed successfully.
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend
        env:
          VITE_SERVER_URI: ${{ secrets.VITE_SERVER_URI }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          test -n "$VITE_SERVER_URI" || (echo "VITE_SERVER_URI is missing" && exit 1)
          test -n "$VITE_FIREBASE_API_KEY" || (echo "VITE_FIREBASE_API_KEY is missing" && exit 1)
          test -n "$VITE_RAZORPAY_KEY_ID" || (echo "VITE_RAZORPAY_KEY_ID is missing" && exit 1)
          cd frontend
          npm ci
          npm run build

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync \
          frontend/dist \
          s3://${{ secrets.S3_BUCKET }} \
          --delete

          # It means to synchronize the new build files
          # from frontend/dist to the S3 bucket.
          #
          # --delete means:
          # Delete objects from S3 that are no longer present
          # in the new frontend/dist folder.

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
          --distribution-id \
          ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"

          # --paths "/*" means invalidate all cached paths/files
          # in CloudFront.
          #
          # It does NOT delete the files from S3.
          #
          # It tells CloudFront to remove the old cached versions.
          # When users request the files again, CloudFront can fetch
          # the latest versions from the S3 origin.